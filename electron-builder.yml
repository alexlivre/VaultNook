appId: com.alexlivre.devvault
productName: VaultNook
directories:
  buildResources: build
  output: dist
files:
  - .vite/build/**
  - .vite/renderer/**
  - package.json
asar: true
npmRebuild: false
afterPack: scripts/apply-fuses.js
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VaultNook
  installerLanguages:
    - en_US
    - pt_BR
